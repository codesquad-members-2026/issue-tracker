spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: never

oauth:
  github:
    client-id: ${OAUTH_CLIENT_ID}
    client-secret: ${OAUTH_CLIENT_SECRET}
    redirect-uri: http://team01-issue-tracker-frontend-deploy.s3-website.ap-northeast-2.amazonaws.com/login/oauth2/code/github

logging:
  level:
    root: INFO
    # 자바 프로젝트 기본 패키지(Base Package) 경로 / src/main/java/com/codesquad_team01/issue_tracker
    com.codesquad_team01.issue_tracker: INFO

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: 3600000